[project]
name = "ledgerflow-backend"
version = "0.1.0"
description = "LedgerFlow sandbox financial infrastructure and payment processing engine"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.165.0",
  "uvicorn[standard]==0.54.0",
  "pydantic-settings==2.16.3",
  "sqlalchemy[asyncio]==2.1.9",
  "asyncpg==0.32.0",
  "alembic==1.20.1",
  "redis==8.2.0",
  "celery==5.7.0",
  "aio-pika==10.2.3",
  "httpx==0.28.1",
  "argon2-cffi==25.1.0",
  "PyJWT==2.15.1",
  "prometheus-client==0.26.0",
  "opentelemetry-instrumentation-fastapi==0.66b2",
  "opentelemetry-exporter-otlp-proto-http==1.45.2",
]

[dependency-groups]
dev = [
  "pytest==9.2.0",
  "pytest-asyncio==1.5.0",
  "pytest-cov==7.1.0",
  "hypothesis==6.170.17",
  "ruff==0.17.6",
  "mypy==2.4.1",
  "locust==2.47.0",
  "pip-audit==2.10.1",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.13"
files = ["app"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["celery", "celery.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-ra --strict-markers"
markers = [
  "integration: requires a disposable PostgreSQL instance",
  "concurrency: verifies real PostgreSQL contention",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
