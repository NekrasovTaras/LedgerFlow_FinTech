name: Bootstrap verification

on:
  push:
    branches: ['feat/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check bootstrap configuration and JavaScript
        run: npm run check
      - name: Install Chromium and system dependencies
        run: npm run browser:install -- --with-deps
      - name: Run browser behavior tests
        run: npm run test:e2e
      - name: Verify retained browser evidence
        run: npm run check:evidence
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bootstrap-browser-evidence
          path: |
            artifacts/
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 7
