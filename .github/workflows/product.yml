name: Product quality gates

on:
  push:
    branches: ['feat/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.12-alpine3.24@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73
        env:
          POSTGRES_USER: ledgerflow
          POSTGRES_PASSWORD: ledgerflow
          POSTGRES_DB: ledgerflow_test
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U ledgerflow -d ledgerflow_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4.12-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
        ports: ['56379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
      rabbitmq:
        image: rabbitmq:4.1.8-management-alpine@sha256:71dc98bb14d16c7240efc1d9b6356e5ac1470a51c63e8cce16f246e09748a995
        env:
          RABBITMQ_DEFAULT_USER: ledgerflow
          RABBITMQ_DEFAULT_PASS: ledgerflow
        ports: ['5673:5672']
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s --health-timeout 5s --health-retries 20
    env:
      SANDBOX_MODE: 'true'
      DATABASE_URL: postgresql+asyncpg://ledgerflow:ledgerflow@127.0.0.1:55432/ledgerflow_test
      REDIS_URL: redis://127.0.0.1:56379/0
      RABBITMQ_URL: amqp://ledgerflow:ledgerflow@127.0.0.1:5673/
      JWT_SECRET: sandbox-ci-signing-key-not-for-production-2026
      WEBHOOK_SECRET: sandbox-webhook-signing-secret
      PROVIDER_ALPHA_URL: http://127.0.0.1:9001
      PROVIDER_BETA_URL: http://127.0.0.1:9002
      WEBHOOK_RECEIVER_URL: http://127.0.0.1:9003/events
      UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
      HYPOTHESIS_STORAGE_DIRECTORY: ${{ github.workspace }}/.cache/hypothesis
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up uv and Python 3.13
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.13.9'
          python-version: '3.13'
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install locked dependencies
        run: uv sync --frozen --all-groups
      - name: Ruff lint and formatting
        run: |
          uv run --frozen ruff check app tests migrations ../mock-services ../infrastructure/postgres
          uv run --frozen ruff format --check app tests migrations ../mock-services ../infrastructure/postgres
      - name: Check backend types
        run: uv run --frozen mypy app ../infrastructure/postgres/runtime_role.py
      - name: Apply migrations on a clean PostgreSQL database
        run: uv run --frozen alembic upgrade head
      - name: Start local simulated providers and receiver
        run: |
          mkdir -p ../artifacts/ci-mocks
          SERVICE_NAME=alpha SERVICE_KIND=provider STATE_PATH="$RUNNER_TEMP/alpha.sqlite3" uv run --frozen uvicorn service:app --app-dir ../mock-services --host 127.0.0.1 --port 9001 > ../artifacts/ci-mocks/alpha.log 2>&1 &
          SERVICE_NAME=beta SERVICE_KIND=provider STATE_PATH="$RUNNER_TEMP/beta.sqlite3" uv run --frozen uvicorn service:app --app-dir ../mock-services --host 127.0.0.1 --port 9002 > ../artifacts/ci-mocks/beta.log 2>&1 &
          SERVICE_NAME=receiver SERVICE_KIND=receiver STATE_PATH="$RUNNER_TEMP/receiver.sqlite3" uv run --frozen uvicorn service:app --app-dir ../mock-services --host 127.0.0.1 --port 9003 > ../artifacts/ci-mocks/receiver.log 2>&1 &
          for port in 9001 9002 9003; do
            for attempt in $(seq 1 30); do
              if curl --fail --silent "http://127.0.0.1:$port/health" > /dev/null; then break; fi
              sleep 1
            done
            curl --fail --silent "http://127.0.0.1:$port/health"
          done
      - name: Verify backend behavior and measured coverage
        run: uv run --frozen pytest --cov=app --cov-report=term-missing --cov-report=xml:../artifacts/backend-coverage.xml --cov-fail-under=80
      - name: Enforce financial ledger coverage
        run: uv run --frozen coverage report --include='*/app/modules/ledger/*' --fail-under=90
      - name: Verify mock durability and webhook signature checks
        run: uv run --frozen pytest ../mock-services/test_service.py -q
      - name: Audit locked Python dependencies
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt --output-file ../artifacts/backend-requirements.txt
          uv run --frozen pip-audit --requirement ../artifacts/backend-requirements.txt --disable-pip --format json --output ../artifacts/python-audit.json
      - name: Upload backend evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node.js 24
        with:
          name: product-backend-evidence
          path: artifacts/
          retention-days: 7

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npm audit --audit-level=high

  images-and-repository:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 2
      - name: Validate Compose configuration
        run: docker compose --profile monitoring config --quiet
      - name: Build application and mock service images
        run: docker compose build backend frontend provider-a
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Install product browser tooling
        run: |
          npm ci
          npm run browser:install -- --with-deps
      - name: Start the complete sandbox
        run: docker compose up -d --wait --wait-timeout 180
      - name: Verify actual product browser scenarios
        run: |
          npm run test:e2e
          node tests/product/verify-evidence.mjs headless
      - name: Check whitespace
        run: git diff --check HEAD^ HEAD
      - name: Check tracked files for secret signatures
        shell: bash
        run: |
          python - <<'PY'
          import pathlib, re, subprocess
          patterns = [
              rb'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----',
              rb'gh[pousr]_[A-Za-z0-9]{30,}',
              rb'github_pat_[A-Za-z0-9_]{30,}',
              rb'AKIA[A-Z0-9]{16}',
              rb'sk-proj-[A-Za-z0-9_-]{30,}',
          ]
          findings = []
          for raw in subprocess.check_output(['git', 'ls-files', '-z']).split(b'\0'):
              if not raw:
                  continue
              path = pathlib.Path(raw.decode())
              if path.suffix in {'.png', '.jpg', '.webm', '.zip'}:
                  continue
              data = path.read_bytes()
              if any(re.search(pattern, data) for pattern in patterns):
                  findings.append(str(path))
          if findings:
              raise SystemExit('Secret signature found in: ' + ', '.join(findings))
          print('No known credential signatures in tracked text files.')
          PY
      - name: Save Compose status and logs
        if: always()
        run: |
          mkdir -p artifacts/ci-compose
          docker compose ps -a > artifacts/ci-compose/status.txt
          docker compose logs --no-color --tail 100 > artifacts/ci-compose/services.log
      - name: Upload product browser and Compose evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: product-browser-compose-evidence
          path: artifacts/
          retention-days: 7
      - name: Stop project services
        if: always()
        run: docker compose down
